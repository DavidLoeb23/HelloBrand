<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3339b9dd-d5eb-4bce-b673-ced91bc2d970/styles.css" />
<script src="_ds/modernist-3339b9dd-d5eb-4bce-b673-ced91bc2d970/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" />
<style>
  @keyframes hb-pulse { 0%,100% { opacity:1 } 50% { opacity:.15 } }
</style>
</helmet>
<a href="#main-content" class="hb-skip-link">Skip to content</a>
<div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);padding:8px var(--space-6);border-bottom:2px solid var(--color-neutral-800);font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--color-neutral-400)">
    <span style="display:flex;align-items:center;gap:8px;color:var(--color-accent-400)"><span style="width:6px;height:6px;background:var(--color-accent);animation:hb-pulse 1.8s ease-in-out infinite"></span>Network live</span>
    <span>Cape Town · 33.9°S 18.4°E</span>
    <span style="color:var(--color-neutral-500)">{{ crumb }}</span>
  </div>
  <header style="position:sticky;top:0;z-index:60;background:rgba(20,19,19,.92);backdrop-filter:blur(12px);border-bottom:2px solid var(--color-neutral-800)">
    <div style="max-width:1560px;margin:0 auto;padding:0 var(--space-6);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-4)">
      <a href="Hello Brand OS Home v2.dc.html" style="display:flex;align-items:center;padding:var(--space-4) var(--space-6) var(--space-4) 0;font-family:var(--font-heading);font-weight:900;font-size:14px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;color:var(--color-neutral-100)">Hello Brand</a>
      <nav id="hb-primary-nav" aria-label="Primary" class="hb-nav-links" data-open="{{ navOpenAttr }}" onKeyDown="{{ navKey }}">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="6">
          <a href="{{ link.href }}" aria-current="{{ link.current }}" style="position:relative;padding:6px 0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid {{ link.rule }};color:{{ link.ink }}" style-hover="color:var(--color-neutral-100)">{{ link.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;flex-wrap:wrap;align-items:stretch">
        <a href="Contact.dc.html" style="display:flex;align-items:center;padding:14px var(--space-4);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;color:var(--color-neutral-400)" style-hover="color:var(--color-neutral-100)">Login</a>
        <a href="Contact.dc.html" style="display:flex;align-items:center;padding:14px var(--space-6);background:var(--color-accent-600);color:#ffffff;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap" style-hover="background:var(--color-accent-700)">Build a campaign</a>
        <button type="button" class="hb-nav-toggle" onClick="{{ navToggle }}" aria-expanded="{{ navExpanded }}" aria-controls="hb-primary-nav" aria-label="{{ navToggleLabel }}" style="align-items:center;padding:14px var(--space-4);border:0;background:transparent;color:var(--color-neutral-100);font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;cursor:pointer">{{ navToggleText }}</button>
      </div>
    </div>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;os&quot;,&quot;media&quot;,&quot;brandbox&quot;,&quot;measurement&quot;,&quot;work&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;os&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hello Brand OS&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LINKS = [
  ["os", "OS", "Hello Brand OS.dc.html"],
  ["media", "Media + Venues", "Media + Venues.dc.html"],
  ["brandbox", "Brand Box", "Brand Box.dc.html"],
  ["measurement", "Measurement", "Measurement + Intelligence.dc.html"],
  ["work", "Work", "Work.dc.html"],
  ["about", "About", "About.dc.html"],
  ["contact", "Contact", "Contact.dc.html"],
];

class Component extends DCLogic {
  state = { navOpen: false };

  renderVals() {
    const active = this.props.active || "";
    const { navOpen } = this.state;
    return {
      crumb: this.props.crumb || "Hello Brand OS",
      links: LINKS.map(([id, label, href]) => {
        const on = id === active;
        return {
          label,
          href,
          current: on ? "page" : null,
          ink: on ? "var(--color-neutral-100)" : "var(--color-neutral-400)",
          rule: on ? "var(--color-accent)" : "transparent",
        };
      }),
      navOpenAttr: navOpen ? "true" : "false",
      navExpanded: navOpen ? "true" : "false",
      navToggleText: navOpen ? "Close" : "Menu",
      navToggleLabel: navOpen ? "Close menu" : "Open menu",
      navToggle: () => this.setState((s) => ({ navOpen: !s.navOpen })),
      navKey: (ev) => {
        if (ev.key === "Escape" && this.state.navOpen) this.setState({ navOpen: false });
      },
    };
  }
}

</script>
</body>
</html>
