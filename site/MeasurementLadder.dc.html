<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3339b9dd-d5eb-4bce-b673-ced91bc2d970/styles.css" />
<script src="_ds/modernist-3339b9dd-d5eb-4bce-b673-ced91bc2d970/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" />
</helmet>
<div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <sc-for list="{{ rungs }}" as="rung" hint-placeholder-count="4">
      <button type="button" onClick="{{ rung.pick }}" aria-pressed="{{ rung.selected }}" style="text-align:left;border:0;border-top:2px solid {{ rung.rule }};background:transparent;padding:var(--space-6) var(--space-6) var(--space-6) 0;cursor:pointer;font-family:var(--font-body);min-width:0;transition:border-color .4s ease">
        <span style="display:block;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:{{ rung.meta }}">{{ rung.confidence }}</span>
        <span style="display:block;margin-top:var(--space-3);font-family:var(--font-heading);font-weight:900;font-size:clamp(20px,2.2vw,32px);letter-spacing:.01em;text-transform:uppercase;transition:color .4s ease;color:{{ rung.ink }}">{{ rung.name }}</span>
      </button>
    </sc-for>
  </div>
  <div style="max-width:820px;padding:var(--space-6) 0 0">
    <p style="margin:0;font-size:17px;line-height:1.5;color:var(--color-neutral-100)">{{ activeRungWhat }}</p>
    <p style="margin:var(--space-3) 0 0;font-size:14px;line-height:1.55;color:var(--color-neutral-500)">Use it for: {{ activeRungUse }}</p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;default&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;estimated&quot;,&quot;modelled&quot;,&quot;measured&quot;,&quot;verified&quot;],&quot;default&quot;:&quot;verified&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const RUNGS = [
  { id: "estimated", name: "Estimated", confidence: "Lowest confidence", what: "An industry or historical assumption applied to a plan — nothing about this campaign observed yet.", use: "early feasibility and budget framing. Never reported as a result." },
  { id: "modelled", name: "Modelled", confidence: "Directional", what: "A projection built from Hello Brand's own comparable campaigns, venue types and audience profiles.", use: "planning reach and setting expectations before a flight goes live." },
  { id: "measured", name: "Measured", confidence: "Observed", what: "Counted activity from the platform itself — plays, claims, sign-ups and playouts, by venue and device.", use: "in-flight optimisation and reporting what actually happened." },
  { id: "verified", name: "Verified", confidence: "Highest confidence", what: "Measured activity reconciled to a consented first-party record, so each interaction is attributable to a person and a place.", use: "ROI cases, brand-lift claims and anything a client will be held to." },
];

class Component extends DCLogic {
  state = { rung: Math.max(0, RUNGS.findIndex((r) => r.id === (this.props.default || "verified"))) };

  renderVals() {
    const { rung } = this.state;
    const ACC = "var(--color-accent)";
    const INK = "var(--color-neutral-100)";
    return {
      rungs: RUNGS.map((r, i) => ({
        name: r.name,
        confidence: r.confidence,
        selected: i === rung ? "true" : "false",
        ink: i === rung ? INK : "var(--color-neutral-400)",
        meta: i === rung ? "var(--color-accent-400)" : "var(--color-neutral-400)",
        rule: i === rung ? ACC : "var(--color-neutral-800)",
        pick: () => this.setState({ rung: i }),
      })),
      activeRungWhat: RUNGS[rung].what,
      activeRungUse: RUNGS[rung].use,
    };
  }
}

</script>
</body>
</html>
